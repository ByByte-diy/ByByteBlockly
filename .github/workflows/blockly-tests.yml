name: Blockly tests

on:
  push:
    paths:
      - "src/app/modules/blockly/**"
      - "vitest.config.ts"
      - "tsconfig.spec.json"
      - "package.json"
      - ".github/workflows/blockly-tests.yml"
  pull_request:
    paths:
      - "src/app/modules/blockly/**"
      - "vitest.config.ts"
      - "tsconfig.spec.json"
      - "package.json"
      - ".github/workflows/blockly-tests.yml"

jobs:
  blockly-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Blockly contract, matrix, and golden tests
        run: npm run test:blockly
