<div class="header-popover">
  <button
    type="button"
    class="header-chip device-selector__trigger"
    [attr.aria-label]="'ui.device_panel' | translate"
    (click)="toggle($event)"
  >
    <span class="header-icon-mask" [style.--icon]="chipIcon" aria-hidden="true"></span>
    <span class="header-chip__label">{{ boardLabel }}</span>
  </button>
  @if (open) {
    <div class="header-popover__panel device-selector__panel" role="dialog" [attr.aria-label]="'ui.device_panel' | translate">
      <div class="header-field">
        <label for="board-select">{{ 'ui.board_label' | translate }}</label>
        <select
          id="board-select"
          [ngModel]="selectedBoard?.id"
          (ngModelChange)="onBoardChange($event)"
        >
          @for (board of boards; track board.id) {
            <option [value]="board.id">{{ board.name }}</option>
          }
        </select>
      </div>

      <div class="header-field">
        <label for="port-select">{{ 'ui.port_label' | translate }}</label>
        @if (hasRealPorts()) {
          <div class="device-selector__port-row">
            <select
              id="port-select"
              [ngModel]="selectedPort?.path"
              (ngModelChange)="onPortChange($event)"
            >
              @for (port of realPorts; track port.path) {
                <option [ngValue]="port.path">
                  {{ port.friendlyName || port.path }}
                </option>
              }
            </select>
            <button
              type="button"
              class="header-btn"
              (click)="refreshPorts()"
              [disabled]="isRefreshing"
              [title]="'ui.refresh_ports' | translate"
            >
              {{ isRefreshing ? '⟳' : '↻' }}
            </button>
          </div>
          <div class="header-action-row device-selector__secondary-actions">
            <button
              type="button"
              class="header-btn header-btn--secondary"
              (click)="requestNewPort()"
              [disabled]="isRefreshing"
            >
              {{ 'ui.connect_device' | translate }}
            </button>
          </div>
        } @else {
          <div class="header-action-row">
            <button
              type="button"
              class="header-btn header-btn--primary device-selector__connect-btn"
              (click)="requestNewPort()"
              [disabled]="isRefreshing"
            >
              {{ 'ui.connect_device' | translate }}
            </button>
            <button
              type="button"
              class="header-btn"
              (click)="refreshPorts()"
              [disabled]="isRefreshing"
              [title]="'ui.refresh_ports' | translate"
            >
              {{ isRefreshing ? '⟳' : '↻' }}
            </button>
          </div>
          <p class="device-selector__hint">{{ 'ui.web_serial_hint' | translate }}</p>
        }
        @if (environmentHintKey) {
          <p class="device-selector__hint device-selector__hint--emphasis">{{ environmentHintKey | translate }}</p>
        }
        @if (portErrorKey) {
          <p class="device-selector__error" role="alert">{{ portErrorKey | translate }}</p>
        }
      </div>
    </div>
  }
</div>
