<div class="header-popover">
  <button
    type="button"
    class="header-icon-btn upload-panel__trigger"
    [attr.aria-label]="'ui.upload_panel' | translate"
    (click)="toggle($event)"
  >
    <span class="header-icon-mask" [style.--icon]="uploadIcon" aria-hidden="true"></span>
    <span class="header-status-dot upload-panel__status-dot" [ngClass]="getStatusDotClass()"></span>
  </button>
  @if (open) {
    <div
      class="header-popover__panel header-popover__panel--align-right upload-panel__panel"
      role="dialog"
      [attr.aria-label]="'ui.upload_panel' | translate"
    >
      <div class="upload-panel__panel-scroll">
        <div class="header-action-row">
          <button
            type="button"
            class="header-btn header-btn--primary"
            (click)="onCompileAndUpload()"
            [disabled]="isProcessing || !isDeviceReady"
          >
            {{ 'ui.btn_upload' | translate }}
          </button>
          <button
            type="button"
            class="header-btn header-btn--secondary"
            (click)="onCompileOnly()"
            [disabled]="isProcessing"
          >
            {{ 'ui.btn_compile' | translate }}
          </button>
        </div>
        <div class="header-status-bar" [ngClass]="getStatusBarClass()">
          <span class="header-status-bar__message">{{ message | translate }}</span>
        </div>
        @if (status === UploadStatus.ERROR) {
          <button type="button" class="upload-panel__open-log" (click)="openBuildLog()">
            {{ 'ui.build_log_open' | translate }}
          </button>
        }
        @if (showProgressBar) {
          <div
            class="upload-panel__progress"
            role="progressbar"
            [attr.aria-valuenow]="progressIndeterminate ? null : progressValue"
            aria-valuemin="0"
            aria-valuemax="100"
            [attr.aria-label]="'ui.compile_progress_label' | translate"
          >
            <div class="upload-panel__progress-track">
              @if (progressIndeterminate) {
                <div class="upload-panel__progress-fill upload-panel__progress-fill--indeterminate"></div>
              } @else {
                <div
                  class="upload-panel__progress-fill"
                  [class.upload-panel__progress-fill--success]="status === UploadStatus.SUCCESS"
                  [class.upload-panel__progress-fill--error]="status === UploadStatus.ERROR"
                  [style.width.%]="progressValue"
                ></div>
              }
            </div>
            @if (!progressIndeterminate) {
              <span class="upload-panel__progress-label">{{ progressValue }}%</span>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
