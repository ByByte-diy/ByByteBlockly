<div class="header-popover">
  <button
    type="button"
    class="header-icon-btn upload-panel__trigger"
    [attr.aria-label]="'ui.upload_panel' | translate"
    (click)="toggle($event)"
  >
    <span class="header-icon-mask" [style.--icon]="uploadIcon" aria-hidden="true"></span>
    <span class="header-status-dot upload-panel__status-dot" [ngClass]="getStatusDotClass()"></span>
  </button>
  @if (open) {
    <div
      class="header-popover__panel header-popover__panel--align-right"
      role="dialog"
      [attr.aria-label]="'ui.upload_panel' | translate"
    >
      <div class="header-action-row">
        <button
          type="button"
          class="header-btn header-btn--primary"
          (click)="onCompileAndUpload()"
          [disabled]="isProcessing || !isDeviceReady"
        >
          {{ 'ui.btn_upload' | translate }}
        </button>
        <button
          type="button"
          class="header-btn header-btn--secondary"
          (click)="onCompileOnly()"
          [disabled]="isProcessing"
        >
          {{ 'ui.btn_compile' | translate }}
        </button>
      </div>
      <div class="header-status-bar" [ngClass]="getStatusBarClass()">
        <span class="header-status-bar__message">{{ message }}</span>
      </div>
    </div>
  }
</div>
